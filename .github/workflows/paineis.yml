name: paineis
# Estudo: baixa dados de vários países (BIS, FRED, Banco Mundial, FMI, JST) para pesquisa/dados/.
on:
  push:
    branches: [claude/project-thread-a3loy5]
    paths: [pesquisa/baixar_paineis.py, .github/workflows/paineis.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python pesquisa/baixar_paineis.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pesquisa/dados
          git commit -m "Estudo: dados de vários países" || echo "nada novo"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
