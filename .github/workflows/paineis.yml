name: paineis
# Estudo: baixa dados de vários países (BIS, FRED, Banco Mundial, FMI, JST) para pesquisa/dados/.
# Uma tarefa por fonte; cada uma grava o que conseguiu, mesmo que outra falhe.
on:
  push:
    branches: [claude/project-thread-a3loy5]
    paths: [pesquisa/baixar_paineis.py, .github/workflows/paineis.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        fonte: [bis, banco_mundial, fmi, jst, fred_globais, fred_pib_real_sa, fred_credito_privado_pib,
                fred_credito_familias_pib, fred_credito_empresas_pib, fred_credito_governo_pib, fred_juro_curto,
                fred_juro_longo, fred_cambio_real_efetivo, fred_imovel_real, fred_cpi, fred_desemprego]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python pesquisa/baixar_paineis.py ${{ matrix.fonte }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pesquisa/dados
          git commit -m "Estudo: dados de ${{ matrix.fonte }}" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
