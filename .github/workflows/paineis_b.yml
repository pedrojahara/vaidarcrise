name: paineis_b
# Estudo, plano B: PIB trimestral e crédito por DBnomics e OECD. Grava o que conseguir mesmo se estourar o tempo.
on:
  push:
    branches: [claude/project-thread-a3loy5]
    paths: [.github/workflows/paineis_b.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fonte: [dbnomics, oecd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: timeout 1800 python pesquisa/baixar_paineis.py ${{ matrix.fonte }} || true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pesquisa/dados
          git commit -m "Estudo: dados de ${{ matrix.fonte }}" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
