name: historico
# Baixa o histórico longo dos indicadores (src/historico.py) e grava em data/historico/.
on:
  push:
    branches: [claude/project-thread-a3loy5]
    paths: [src/historico.py, .github/workflows/historico.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - run: python src/historico.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico
          git commit -m "Histórico dos indicadores para a calibração" || echo "nada novo"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
