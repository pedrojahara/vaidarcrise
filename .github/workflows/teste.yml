name: teste
# Teste da atualização com dados de hoje, sem LLM e sem publicar nada. Não vai para a main.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-a3loy5]
    paths: [src/**, config/**, templates/**, .github/workflows/teste.yml]
permissions:
  contents: read
jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: rodada sem LLM
        env:
          TZ: America/Sao_Paulo
        run: |
          python src/run.py --sem-llm --forcar --horas 6
          python - <<'PY'
          import json, glob
          r = json.load(open(sorted(glob.glob("runs/*.json"))[-1]))
          res = r["resultado"]
          print("ERROS COLETA:", r["insumos"]["erros_coleta"])
          print("NIVEL:", res["nivel"])
          g = res["gar"]
          print("CENARIOS:", round(g["cenario_ruim"], 3), round(g["cenario_normal"], 3))
          for e in g["entradas"]:
              print("ENTRADA", e["id"], round(e["valor"], 3), e["ref"], "efeito", round(e["efeito"], 3), e.get("reaproveitado"))
          for x in res["indicadores"]:
              print("IND", x["id"], x.get("valor"), x.get("ref"), x["situacao"])
          print("FALTANDO", res["faltando"], "REAPROVEITADOS", res["reaproveitados"])
          print(json.dumps(json.load(open("docs/data.json")), ensure_ascii=False)[:3000])
          PY
      - name: fontes do Ibovespa
        run: |
          python - <<'PY'
          import base64, json, requests
          UA = {"User-Agent": "Mozilla/5.0 vaidarcrise.com.br"}
          for ano in (2026, 2025, 2003):
              q = base64.b64encode(json.dumps({"language": "pt-br", "index": "IBOV", "year": str(ano)}).encode()).decode()
              url = f"https://sistemaswebb3-listados.b3.com.br/indexStatisticsProxy/IndexCall/GetPortfolioDay/{q}"
              try:
                  r = requests.get(url, headers=UA, timeout=60)
                  print("B3", ano, r.status_code, r.text[:600])
              except Exception as e:
                  print("B3", ano, "ERRO", e)
          for rng in ("max",):
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/%5EBVSP?range={rng}&interval=1mo"
              try:
                  r = requests.get(url, headers=UA, timeout=60)
                  j = r.json()["chart"]["result"][0]
                  ts, cl = j["timestamp"], j["indicators"]["quote"][0]["close"]
                  print("YAHOO", r.status_code, len(ts), ts[0], cl[:3], ts[-1], cl[-14:])
              except Exception as e:
                  print("YAHOO ERRO", e)
          PY
